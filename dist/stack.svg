<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Orbinza signal stack</title><desc id="desc">Three terminal surfaces for observe, model and journal.</desc>
<rect width="1200" height="1200" fill="#090d14"/>
<text x="64" y="57" fill="#28d7e8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">ORBINZA</text>
<text x="64" y="84" fill="#8294ab" font-family="Consolas, monospace" font-size="13" font-weight="400" text-anchor="start">WORKFLOW / THREE SURFACES</text>
<text x="1136" y="57" fill="#f4b84a" font-family="Consolas, monospace" font-size="13" font-weight="400" text-anchor="end">SOLANA / PREVIEW</text>
<polyline points="64.00,111.00 1136.00,111.00" fill="none" stroke="#203247" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="82" y="205" fill="#eef6ff" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="700" text-anchor="start">From signal</text>
<text x="82" y="266" fill="#28d7e8" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="700" text-anchor="start">to scenario.</text>
<rect x="82" y="370" width="1036" height="140" rx="8" fill="#101925" stroke="#203247" stroke-width="1"/>

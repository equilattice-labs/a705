<text x="205" y="469" fill="#8294ab" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Read the market surface.</text>
<text x="1047" y="449" fill="#28d7e8" font-family="Consolas, monospace" font-size="13" font-weight="400" text-anchor="end">ACTIVE</text>
<polyline points="1046.00,520.00 1046.00,545.00" fill="none" stroke="#28d7e8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1038.00,536.00 1046.00,545.00 1054.00,536.00" fill="none" stroke="#28d7e8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="82" y="555" width="1036" height="140" rx="8" fill="#101925" stroke="#203247" stroke-width="1"/>
<circle cx="144" cy="625" r="28" fill="#090d14" stroke="#f4b84a" stroke-width="2"/>
<text x="144" y="632" fill="#f4b84a" font-family="Consolas, monospace" font-size="15" font-weight="400" text-anchor="middle">02</text>
<text x="205" y="617" fill="#f4b84a" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">MODEL</text>
<text x="205" y="654" fill="#8294ab" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Move the price slider.</text>
<text x="1047" y="634" fill="#f4b84a" font-family="Consolas, monospace" font-size="13" font-weight="400" text-anchor="end">ACTIVE</text>
<polyline points="1046.00,705.00 1046.00,730.00" fill="none" stroke="#f4b84a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1038.00,721.00 1046.00,730.00 1054.00,721.00" fill="none" stroke="#f4b84a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="82" y="740" width="1036" height="140" rx="8" fill="#101925" stroke="#203247" stroke-width="1"/>
<circle cx="144" cy="810" r="28" fill="#090d14" stroke="#f05bbb" stroke-width="2"/>
<text x="144" y="817" fill="#f05bbb" font-family="Consolas, monospace" font-size="15" font-weight="400" text-anchor="middle">03</text>
<text x="205" y="802" fill="#f05bbb" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">JOURNAL</text>
<text x="205" y="839" fill="#8294ab" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Keep the reason local.</text>
<text x="1047" y="819" fill="#f05bbb" font-family="Consolas, monospace" font-size="13" font-weight="400" text-anchor="end">ACTIVE</text>
<rect x="82" y="1004" width="1036" height="75" rx="6" fill="#090d14" stroke="#203247" stroke-width="1"/>

<text x="144" y="650" fill="#f4b84a" font-family="Consolas, monospace" font-size="15" font-weight="400" text-anchor="middle">02</text>
<text x="205" y="633" fill="#f4b84a" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start">PAYOFF</text>
<text x="205" y="671" fill="#eef6ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Set the boundary</text>
<text x="1049" y="651" fill="#f4b84a" font-family="Consolas, monospace" font-size="13" font-weight="400" text-anchor="end">OPEN</text>

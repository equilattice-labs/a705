<text x="205" y="477" fill="#eef6ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Observe the signal</text>
<text x="1049" y="457" fill="#28d7e8" font-family="Consolas, monospace" font-size="13" font-weight="400" text-anchor="end">OPEN</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Orbinza Solana workflow</title><desc id="desc">A compact market workflow from watchlist to payoff model and local journal.</desc>
<rect width="1200" height="1200" fill="#090d14"/>
<text x="64" y="57" fill="#28d7e8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">ORBINZA</text>
<text x="64" y="84" fill="#8294ab" font-family="Consolas, monospace" font-size="13" font-weight="400" text-anchor="start">SOLANA / WORKFLOW</text>
<text x="1136" y="57" fill="#f4b84a" font-family="Consolas, monospace" font-size="13" font-weight="400" text-anchor="end">OBZA / PREVIEW</text>
<polyline points="64.00,111.00 1136.00,111.00" fill="none" stroke="#203247" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="82" y="196" fill="#eef6ff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Scan. Model.</text>
<text x="82" y="255" fill="#28d7e8" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Keep the proof.</text>
<text x="84" y="302" fill="#8294ab" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">A working surface for user-priced crypto scenarios.</text>

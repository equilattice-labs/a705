<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Premicairn: Read the case. Find the gaps.</title><desc id="desc">Original Premicairn editorial research-folio artwork. Sample equity research, hypothetical scenarios, and a browser-local decision journal.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f8f3e9"/><g transform="translate(56 28) scale(0.25)"><rect x="36" y="79" width="131" height="143" rx="7" fill="#b5412c"/><rect x="64" y="53" width="131" height="143" rx="7" fill="#eedacc"/><rect x="92" y="27" width="131" height="143" rx="7" fill="#462c34"/><circle cx="157.5" cy="95" r="40" fill="#dfe9e5"/><circle cx="168.5" cy="84" r="26" fill="#462c34"/><path d="M112 148L185 148" fill="none" stroke="#f8f3e9" stroke-width="5"/></g><text x="133" y="75.36" fill="#462c34" font-family="Georgia, Times New Roman, serif" font-size="39.68" font-weight="400" letter-spacing="-1.6">Premicairn</text><text x="1000" y="68" fill="#715e60" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">RESEARCH NOTES / THE EVIDENCE</text><path d="M64 116L1536 116" fill="none" stroke="#cdbdb4" stroke-width="1"/><text x="1490" y="69" fill="#b5412c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">01</text><text x="66" y="186" fill="#b5412c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">01 / START WITH A BETTER QUESTION</text><text x="59" y="291" fill="#462c34" font-family="Georgia, Times New Roman, serif" font-size="91" font-weight="400" letter-spacing="-2.8">Read the case.</text><text x="59" y="396" fill="#b5412c" font-family="Georgia, Times New Roman, serif" font-size="91" font-weight="400" letter-spacing="-2.8" font-style="italic">Find the gaps.</text><text x="66" y="467" fill="#715e60" font-family="Arial, Helvetica, sans-serif" font-size="26" font-
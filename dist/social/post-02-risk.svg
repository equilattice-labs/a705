666667 311L1440.4166666666667 318" fill="none" stroke="#344452" stroke-width="1"/><path d="M1458.3333333333333 311L1458.3333333333333 327" fill="none" stroke="#344452" stroke-width="1"/><path d="M1476.25 311L1476.25 318" fill="none" stroke="#344452" stroke-width="1"/><path d="M1494.1666666666667 311L1494.1666666666667 318" fill="none" stroke="#344452" stroke-width="1"/><path d="M1512.0833333333333 311L1512.0833333333333 318" fill="none" stroke="#344452" stroke-width="1"/><path d="M1530.0 311L1530.0 327" fill="none" stroke="#344452" stroke-width="1"/><text x="1100" y="371" fill="#D5FA5B" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0">Assumptions, not forecasts.</text><rect x="65" y="471" width="464" height="270" rx="0" fill="#1D2935"/><path d="M65 471L529 471" fill="none" stroke="#F6BA74" stroke-width="4"/><text x="91" y="514" fill="#F6BA74" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">PATH 01 / BEAR</text><text x="87" y="628" fill="#F6BA74" font-family="Arial, Helvetica, sans-serif" font-size="87" font-weight="700" letter-spacing="-3">-12%</text><text x="91" y="697" fill="#B5C0CA" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="0">Where does the case weaken?</text><rect x="568" y="471" width="464" height="270" rx="0" fill="#1D2935"/><path d="M568 471L1032 471" fill="none" stroke="#D5FA5B" stroke-width="4"/><text x="594" y="514" fill="#D5FA5B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">PATH 02 / BASE</text><text x="590" y="628" fill="#D5FA5B" font-family="Arial, Helvetica, sans-serif" font-size="87" font-weight="700" letter-spacing="-3">+6%</text><text x="594" y="697" fill="#B5C0CA" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="0">What needs to remain true?</text><rect x="1071" y="471" width="464" height="270" rx="0" fill="#1D2935"/><path d="M1071 471L1535 471" fill="none" stroke="#F4F6F8" stroke-width="4"/><text x="1097" y="514" fill="#F4F6F8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">PATH 03 / BULL</text><text x="1093" y="628" fill="#F4F6F8" font-family="Arial, Helvetica, sans-serif" font-size="87" font-weight="700" letter-spacing="-3">+18%</text><text x="1097" y="697" fill="#B5C0CA" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="0">What does optimism leave out?</text><text x="65" y="782" fill="#B5C0CA" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SCENARIO MOVES ARE HYPOTHETICAL. THEY ARE NOT PROBABILITIES OR EXPECTED RETURNS.</text><path d="M65 807L1535 807" fill="none" stroke="#344452" stroke-width="1"/><text x="65" y="852" fill="#B5C0CA" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.3">RESEARCH PREVIEW / YOUR JUDGMENT</text><text x="1120" y="852" fill="#D5FA5B" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="0">thesivellum.xyz  /  @thesivellum</text></svg>

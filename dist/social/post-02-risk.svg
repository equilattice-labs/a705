<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Thesivellum: Move one input. Read every outcome.</title><desc id="desc">Original Thesivellum decision-workspace artwork. Sample equity research, illustrative scenarios, and a browser-local decision journal.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#111923"/><g transform="translate(57 33) scale(0.234375)"><path d="M49 195L110 134V75H143V120L181 82H164V49H220V105H187V128L142 173L117 148L74 220Z" fill="#D5FA5B"/><path d="M149 151H216V184H182V218H149Z" fill="#D5FA5B"/></g><text x="131" y="78.6" fill="#F4F6F8" font-family="Arial, Helvetica, sans-serif" font-size="42.0" font-weight="700" letter-spacing="-1.8">Thesivellum</text><rect x="1121" y="48" width="344" height="34" rx="17" fill="#1D2935"/><circle cx="1138" cy="65" r="4" fill="#D5FA5B"/><text x="1152" y="71" fill="#D5FA5B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="0.7">STRESS THE SCENARIO</text><text x="1502" y="73" fill="#B5C0CA" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0">02</text><path d="M65 122L1535 122" fill="none" stroke="#344452" stroke-width="1"/><text x="65" y="201" fill="#D5FA5B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">02 / CHANGE THE ASSUMPTIONS</text><text x="59" y="298" fill="#F4F6F8" font-family="Arial, Helvetica, sans-serif" font-size="85" font-weight="700" letter-spacing="-3.5">Move one input.</text><text x="59" y="396" fill="#F4F6F8" font-family="Arial, Helvetica, sans-serif" font-size="85" font-weight="700" letter-spacing="-3.5">Read every outcome.</text><text x="1100" y="241" fill="#B5C0CA" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">ILLUSTRATIVE</text><text x="1100" y="271" fill="#B5C0CA" font-family="Arial, Helvetica, san
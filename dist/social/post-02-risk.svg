<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Folivect — Test the assumptions</title><desc id="desc">Original Folivect artwork. A research preview with sample data, local decision records, and no trade execution.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101315"/><g transform="translate(66 46) scale(0.21875)"><path d="M29 49H127V80H61V112H114V143H61V207H29Z" fill="#CEF576"/><path d="M114 49H145L171 157L197 49H228L187 207H155Z" fill="#C4B5FD"/></g><text x="135" y="90.24000000000001" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="44.800000000000004" font-weight="700" letter-spacing="-1.2">Folivect</text><text x="1090" y="82" fill="#A7B2AB" font-family="Consolas, monospace" font-size="16" font-weight="400" letter-spacing="1">TEST THE ASSUMPTIONS</text><text x="1482" y="84" fill="#A7B2AB" font-family="Consolas, monospace" font-size="21" font-weight="500" letter-spacing="0">02</text><path d="M70 126L1530 126" stroke="#344039" stroke-width="1"/><text x="68" y="246" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="83" font-weight="700" letter-spacing="-3">Change the input.</text><text x="68" y="340" fill="#CEF576" font-family="Arial, Helvetica, sans-serif" font-size="83" font-weight="700" letter-spacing="-3">Inspect the consequence.</text><text x="74" y="406" fill="#A7B2AB" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" letter-spacing="0">One position. Three hypothetical paths. A clearer sense of the downside.</text><rect x="70" y="479" width="478" height="229" rx="8" fill="#191E22" stroke="#344039"/><text x="95" y="518" fill="#A7B2AB" font-family="Consolas, monospace" font-size="16" font-weight="400" letter-spacing="2">BEAR</text><text x="95" y="603" fill="#C4B5FD" font-family="Consolas, monospace" font-size="67" font-weight="500" letter-spacing="-2">-12%</text><text x="95" y="670" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0">Challenge the thesis</text><rect x="561" y="479" width="478" height="229" rx="8" fill="#191E22" stroke="#344039"/><text x="586" y="518" fill="#A7B2AB" font-family="Consolas, monospace" font-size="16" font-weight="400" letter-spacing="2">BASE</text><text x="586" y="603" fill="#CEF576" font-family="Consolas, monospace" font-size="67" font-weight="500" letter-spacing="-2">+6%</text><text x="586" y="670" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0">State the assumptions</text><rect x="1052" y="479" width="478" height="229" rx="8" fill="#191E22" stroke="#344039"/><text x="1077" y="518" fill="#A7B2AB" font-family="Consolas, monospace" font-size="16" font-weight="400" letter-spacing="2">BULL</text><text x="1077" y="603" fill="#EEF2ED" font-family="Consolas, monospace" font-size="67" font-weight="500" letter-spacing="-2">+18%</text><text x="1077" y="670" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0">Question the upside</text><text x="74" y="761" fill="#A7B2AB" font-family="Consolas, monospace" font-size="17" font-weight="400" letter-spacing="0.5">ILLUSTRATIVE 30-DAY PRICE MOVES / NOT FORECASTS OR PROBABILITIES</text><path d="M70 804L1530 804" stroke="#344039" stroke-width="1"/><text x="72" y="853" fill="#A7B2AB" font-family="Consolas, monospace" font-size="16" font-weight="400" letter-spacing="1">RESEARCH TOOLS / YOUR JUDGMENT</text><text x="1130" y="853" fill="#A7B2AB" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" letter-spacing="0">folivect.xyz  /  @folivect</text></svg>

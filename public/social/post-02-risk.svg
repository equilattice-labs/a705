<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Scenarill: Think in branches.</title><desc id="desc">Original Scenarill branching research diagram. Sample data, hypothetical scenarios, browser-local journal.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#0b111b"/><g transform="translate(54 28) scale(0.25)"><g fill="none" stroke="#c4f06a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"><path d="M54 195V160Q54 128 91 128H165Q202 128 202 91V59"/><path d="M54 195V160Q54 128 91 128H165Q202 128 202 165V195"/><path d="M54 59V91Q54 128 91 128H202"/></g><circle cx="54" cy="59" r="12" fill="#8fb9ff"/><circle cx="202" cy="59" r="12" fill="#8fb9ff"/><circle cx="202" cy="195" r="12" fill="#8fb9ff"/></g><text x="133" y="74.72" fill="#edf3f8" font-family="Segoe UI, Arial, sans-serif" font-size="39.68" font-weight="650" letter-spacing="-1.5">Scenarill</text><text x="1040" y="68" fill="#a5b1c2" font-family="Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">THE SCENARIO</text><text x="1482" y="68" fill="#c4f06a" font-family="Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">02</text><path d="M64 118L1536 118" fill="none" stroke="#263247" stroke-width="1"/><text x="64" y="194" fill="#c4f06a" font-family="Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">02 / CHANGE THE ASSUMPTIONS</text><text x="58" y="305" fill="#edf3f8" font-family="Segoe UI, Arial, sans-serif" font-size="92" font-weight="650" letter-spacing="-3">Think in branches.</text><text x="65" y="371" fill="#a5b1c2" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" letter-spacing="0">Compare what could happen before you record what you think.</text><rect x="64" y="435" width="464" height="279" rx="20" fill="#121c2b" stroke="#263247"/><text x="93" y="481" fill="#f2a5a7" font-family="Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">BEAR</text><text x="88" y="596" fill="#f2a5a7" font-family="Consolas, monospace" font-size="86" font-weight="600" letter-spacing="-5">-12%</text><text x="93" y="665" fill="#a5b1c2" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" letter-spacing="0">Expectations reset.</text><rect x="560" y="435" width="464" height="279" rx="20" fill="#121c2b" stroke="#263247"/><text x="589" y="481" fill="#8fb9ff" font-family="Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">BASE</text><text x="584" y="596" fill="#8fb9ff" font-family="Consolas, monospace" font-size="86" font-weight="600" letter-spacing="-5">+6%</text><text x="589" y="665" fill="#a5b1c2" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" letter-spacing="0">The thesis develops.</text><rect x="1056" y="435" width="464" height="279" rx="20" fill="#121c2b" stroke="#263247"/><text x="1085" y="481" fill="#c4f06a" font-family="Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">BULL</text><text x="1080" y="596" fill="#c4f06a" font-family="Consolas, monospace" font-size="86" font-weight="600" letter-spacing="-5">+18%</text><text x="1085" y="665" fill="#a5b1c2" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" letter-spacing="0">Growth surprises.</text><text x="65" y="767" fill="#a5b1c2" font-family="Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5">HYPOTHETICAL 30-DAY MOVES. NOT FORECASTS OR PROBABILITIES.</text><path d="M64 812L1536 812" fill="none" stroke="#263247" stroke-width="1"/><text x="64" y="854" fill="#a5b1c2" font-family="Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.5">RESEARCH PREVIEW / SAMPLE DATA</text><text x="1090" y="854" fill="#a5b1c2" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="0">scenarill.xyz / @scenarill</text></svg>

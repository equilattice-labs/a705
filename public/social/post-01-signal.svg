<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Folivect — Build the case</title><desc id="desc">Original Folivect artwork. A research preview with sample data, local decision records, and no trade execution.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101315"/><g transform="translate(66 46) scale(0.21875)"><path d="M29 49H127V80H61V112H114V143H61V207H29Z" fill="#CEF576"/><path d="M114 49H145L171 157L197 49H228L187 207H155Z" fill="#C4B5FD"/></g><text x="135" y="90.24000000000001" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="44.800000000000004" font-weight="700" letter-spacing="-1.2">Folivect</text><text x="1090" y="82" fill="#A7B2AB" font-family="Consolas, monospace" font-size="16" font-weight="400" letter-spacing="1">BUILD THE CASE</text><text x="1482" y="84" fill="#A7B2AB" font-family="Consolas, monospace" font-size="21" font-weight="500" letter-spacing="0">01</text><path d="M70 126L1530 126" stroke="#344039" stroke-width="1"/><text x="68" y="257" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="700" letter-spacing="-3">A thesis is a starting point.</text><text x="71" y="322" fill="#A7B2AB" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" letter-spacing="0">Give every observation a source. Give every case a challenge.</text><rect x="70" y="410" width="478" height="327" rx="8" fill="#191E22"/><text x="96" y="456" fill="#CEF576" font-family="Consolas, monospace" font-size="18" font-weight="400" letter-spacing="0">01</text><path d="M484 457L509 432M484 432H509V457" fill="none" stroke="#CEF576" stroke-width="2"/><text x="96" y="540" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" letter-spacing="-1">Evidence</text><path d="M96 568L519 568" stroke="#344039" stroke-width="1"/><text x="96" y="626" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" letter-spacing="0">What can you inspect?</text><text x="96" y="681" fill="#A7B2AB" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0">Start with the source.</text><rect x="561" y="410" width="478" height="327" rx="8" fill="#191E22"/><text x="587" y="456" fill="#EEF2ED" font-family="Consolas, monospace" font-size="18" font-weight="400" letter-spacing="0">02</text><path d="M975 457L1000 432M975 432H1000V457" fill="none" stroke="#EEF2ED" stroke-width="2"/><text x="587" y="540" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" letter-spacing="-1">Interpretation</text><path d="M587 568L1010 568" stroke="#344039" stroke-width="1"/><text x="587" y="626" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" letter-spacing="0">What does it suggest?</text><text x="587" y="681" fill="#A7B2AB" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0">Separate the fact from the view.</text><rect x="1052" y="410" width="478" height="327" rx="8" fill="#191E22"/><text x="1078" y="456" fill="#C4B5FD" font-family="Consolas, monospace" font-size="18" font-weight="400" letter-spacing="0">03</text><path d="M1466 457L1491 432M1466 432H1491V457" fill="none" stroke="#C4B5FD" stroke-width="2"/><text x="1078" y="540" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" letter-spacing="-1">Counter-case</text><path d="M1078 568L1501 568" stroke="#344039" stroke-width="1"/><text x="1078" y="626" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" letter-spacing="0">What could change it?</text><text x="1078" y="681" fill="#A7B2AB" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0">Make the uncertainty visible.</text><path d="M70 804L1530 804" stroke="#344039" stroke-width="1"/><text x="72" y="853" fill="#A7B2AB" font-family="Consolas, monospace" font-size="16" font-weight="400" letter-spacing="1">RESEARCH TOOLS / YOUR JUDGMENT</text><text x="1130" y="853" fill="#A7B2AB" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" letter-spacing="0">folivect.xyz  /  @folivect</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Folivect — Keep your reasoning</title><desc id="desc">Original Folivect artwork. A research preview with sample data, local decision records, and no trade execution.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101315"/><g transform="translate(66 46) scale(0.21875)"><path d="M29 49H127V80H61V112H114V143H61V207H29Z" fill="#CEF576"/><path d="M114 49H145L171 157L197 49H228L187 207H155Z" fill="#C4B5FD"/></g><text x="135" y="90.24000000000001" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="44.800000000000004" font-weight="700" letter-spacing="-1.2">Folivect</text><text x="1090" y="82" fill="#A7B2AB" font-family="Consolas, monospace" font-size="16" font-weight="400" letter-spacing="1">KEEP THE RECORD</text><text x="1482" y="84" fill="#A7B2AB" font-family="Consolas, monospace" font-size="21" font-weight="500" letter-spacing="0">03</text><path d="M70 126L1530 126" stroke="#344039" stroke-width="1"/><text x="68" y="252" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="700" letter-spacing="-3">Keep your reasoning.</text><text x="72" y="323" fill="#A7B2AB" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" letter-spacing="0">The decision matters. So does the thinking that led to it.</text><rect x="70" y="384" width="1460" height="356" rx="8" fill="#191E22"/><rect x="70" y="384" width="8" height="356" rx="0" fill="#CEF576"/><text x="107" y="432" fill="#CEF576" font-family="Consolas, monospace" font-size="17" font-weight="400" letter-spacing="1">DECISION RECORD / 001</text><text x="1190" y="432" fill="#A7B2AB" font-family="Consolas, monospace" font-size="16" font-weight="400" letter-spacing="0">SAVED ON THIS DEVICE</text><path d="M106 467L1490 467" stroke="#344039" stroke-width="1"/><text x="109" y="508" fill="#A7B2AB" font-family="Consolas, monospace" font-size="16" font-weight="400" letter-spacing="0.7">CONTEXT</text><text x="408" y="511" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" letter-spacing="0">The asset, the scenario, and the source.</text><path d="M106 554L1490 554" stroke="#344039" stroke-width="1"/><text x="109" y="595" fill="#A7B2AB" font-family="Consolas, monospace" font-size="16" font-weight="400" letter-spacing="0.7">THESIS</text><text x="408" y="598" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" letter-spacing="0">What I believe — and what would change my mind.</text><path d="M106 641L1490 641" stroke="#344039" stroke-width="1"/><text x="109" y="682" fill="#A7B2AB" font-family="Consolas, monospace" font-size="16" font-weight="400" letter-spacing="0.7">NEXT REVIEW</text><text x="408" y="685" fill="#EEF2ED" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" letter-spacing="0">A question to return to, with fresh evidence.</text><path d="M70 804L1530 804" stroke="#344039" stroke-width="1"/><text x="72" y="853" fill="#A7B2AB" font-family="Consolas, monospace" font-size="16" font-weight="400" letter-spacing="1">RESEARCH TOOLS / YOUR JUDGMENT</text><text x="1130" y="853" fill="#A7B2AB" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" letter-spacing="0">folivect.xyz  /  @folivect</text></svg>

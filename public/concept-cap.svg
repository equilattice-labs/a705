<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Defined cap model</title><desc id="desc">An illustrative price path meets cap K at the model boundary.</desc>
<rect width="1200" height="675" fill="#10120f"/>

<polyline points="128,380 1074,380" fill="none" stroke="#30362e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="108" y="385" fill="#a0a79b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="end">$200</text>

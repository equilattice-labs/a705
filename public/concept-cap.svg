<text x="54" y="126" fill="#f1f3ed" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="start">K marks the modeled boundary.</text>
<text x="54" y="160" fill="#a0a79b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">The payoff view separates value at and above the selected cap.</text>
